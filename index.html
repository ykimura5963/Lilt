<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lilt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="logo">Lilt</div>
  <div class="header-sub" id="header-sub">動画ファイルを選択してください</div>
</header>

<div class="main">
  <div class="left-col">

    <!-- ── 動画パネル ── -->
    <div class="video-panel">
      <div class="file-bar">
        <button class="file-btn" onclick="openLibrary()">▶ 動画を開く</button>
        <!-- 「ファイルから」ボタンは廃止（翻訳/アノテーション生成からの導線で「動画を開く」のみで足りるため）。
             input#local-file は 04-player.js / 09-io-save-load.js が参照するため非表示で残置。 -->
        <input type="file" id="local-file" accept="video/*,audio/*" style="display:none">
        <!-- スマホ（Android）用: 端末ローカルの親フォルダを選び、配下のプロジェクトを読み込む -->
        <input type="file" id="local-dir" webkitdirectory directory multiple style="display:none" onchange="onLocalDirSelected(this)">
        <label class="md-btn" id="md-label" style="display:none">📝 MD読込<input type="file" id="md-file" accept=".md,.txt" style="display:none" onchange="onMdFileLoad(this)"></label>
        <label class="anno-btn" id="anno-bar-label" style="display:none">📂 アノテーション<input type="file" id="anno-bar-input" accept=".json,application/json" style="display:none" onchange="onAnnotationFileLoad(this)"></label>
        <span class="file-name" id="file-name">未選択</span>
      </div>

      <div class="video-wrap" id="local-wrap">
        <video id="vid" preload="metadata" style="background:#000"></video>
        <div id="no-file" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
          <span style="font-size:12px;font-family:var(--mono);color:var(--muted);text-align:center;line-height:2.2">「動画を開く」から<br>mp4 / m4a を選択</span>
        </div>
      </div>
      <div class="video-wrap" id="yt-wrap" style="display:none">
        <iframe id="yt-player" src="about:blank"
          data-src="https://www.youtube.com/embed/xDK42rroFYE?enablejsapi=1&start=394&rel=0&modestbranding=1&controls=0&disablekb=1"
          allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
      </div>

    </div>

    <!-- ── コントロールバー ── -->
    <div class="ctrl-bar" id="ctrl-bar">
      <button class="ctrl-btn on" id="btn-stress"  onclick="toggleLayer('stress',this)" title="強弱（強勢）の表示"><span class="ico">●</span><span class="lbl">強弱</span></button>
      <button class="ctrl-btn on" id="btn-inton"   onclick="toggleLayer('inton',this)" title="抑揚（イントネーション）の表示"><span class="ico">〜</span><span class="lbl">抑揚</span></button>
      <button class="ctrl-btn on" id="btn-elision" onclick="toggleLayer('elision',this)" title="消音（脱落・弱化）の表示"><span class="ico">×</span><span class="lbl">消音</span></button>
      <button class="ctrl-btn on" id="btn-rhythm" onclick="toggleRhythmSync(this)" title="チャンク内の語タイミングを話速リズムで配分（OFFで均等割り）"><span class="ico">♪</span><span class="lbl">リズム</span></button>
      <button class="ctrl-btn on" id="btn-follow" onclick="toggleAutoFollow(this)" title="再生中、現在の行へ自動スクロール"><span class="ico">📌</span><span class="lbl">追従</span></button>
      <button class="ctrl-btn" id="btn-chunk-repeat" type="button" onclick="toggleChunkRepeat()" title="再生中の段落を繰り返し"><span class="ico">🔁</span><span class="lbl">チャンク</span></button>
      <button class="ctrl-btn" id="btn-font-inc" onclick="toggleFontScale(this)" title="文字の拡大/縮小を切替"><span class="ico">A＋</span></button>
      <select class="spd" id="offset-sel" onchange="updateOffset(this.value)" title="同期オフセット（音声が速い→マイナス、遅い→プラス）"></select>
      <select class="spd" id="spd-sel" onchange="setSpeed(this.value)" title="再生速度">
        <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
        <option value="1" selected>1.0×</option><option value="1.25">1.25×</option>
      </select>
      <select class="spd" id="sh-loops" onchange="setPracticeLoops(this.value)" title="練習ループ回数">
        <option value="1">🔁×1</option><option value="2" selected>🔁×2</option><option value="3">🔁×3</option><option value="0">🔁∞</option>
      </select>
      <select class="spd" id="sh-listen" onchange="setPracticeListen(this.value)" title="録音前にモデルを聴く回数">
        <option value="1" selected>🔊×1</option><option value="2">🔊×2</option><option value="3">🔊×3</option>
      </select>
      <select class="spd" id="sh-gap" onchange="setPracticeGap(this.value)" title="聴く→録音の間（ポーズ）">
        <option value="600">間0.6s</option><option value="1200" selected>間1.2s</option><option value="2000">間2.0s</option><option value="3000">間3.0s</option>
      </select>
      <button class="ctrl-btn" id="btn-sh-auto" onclick="togglePracticeAuto(this)" title="チャンクを自動で進む連続練習"><span class="ico">⏩</span><span class="lbl">連続</span></button>
      <button class="ctrl-btn play-ctrl" id="btn-play" onclick="playVideo()" title="再生"><span class="ico">▶</span></button>
      <button class="ctrl-btn play-ctrl" id="btn-pause" onclick="pauseVideo()" title="停止"><span class="ico">⏸</span></button>
      <div class="prog-wrap"><div class="prog-bg" id="prog-bg" onclick="seekByClick(event)"><div class="prog-fill" id="prog-fill"></div></div></div>
      <span class="time-disp" id="time-disp">0:00</span>
    </div>

    <!-- ── 練習ステータスバー（練習中のみ表示） ── -->
    <div id="sh-practice-bar" style="display:none">
      <span id="sh-practice-phase">練習中…</span>
      <span class="sh-practice-actions">
        <button type="button" id="sh-pause-btn" onclick="practiceTogglePause()" title="一時停止 / 再開">⏸</button>
        <button type="button" onclick="practiceSkip()" title="次のチャンクへ">⏭</button>
        <button type="button" onclick="stopPractice()" title="練習を終了">⏹</button>
      </span>
    </div>

    <!-- ── スマホ専用：凡例&操作アコーディオン（コメントアウト） ──
    <div id="mobile-panel">
      <div class="mp-toggle" id="mp-toggle" onclick="toggleMobilePanel()">
        <span>▸ 凡例</span><span class="arr">▾</span>
      </div>
      <div id="mp-inner" style="display:none">
        <div id="mp-content" style="padding:.75rem 1rem;background:var(--surf2);border-bottom:.5px solid var(--bd)"></div>
      </div>
    </div>
    -->
    <div id="mobile-panel" style="display:none"></div>

    <!-- ── トランスクリプト ── -->
    <div class="transcript-panel" id="transcript"></div>

    <!-- ── スマホ専用：フレーズリスト ── -->
    <div id="mobile-phrases" style="display:none"></div>

  </div><!-- /left-col -->

  <!-- ── デスクトップサイドバー ── -->
  <div class="sidebar">
    <div class="stabs">
      <div class="stab on" onclick="switchTab('phrases',this)">フレーズ</div>
      <div class="stab"    onclick="switchTab('legend',this)">凡例</div>
      <div class="stab pc-only" onclick="switchTab('generate',this)">生成</div>
      <div class="stab"    onclick="switchTab('settings',this)">設定</div>
    </div>
    <div class="sbody" id="sbody"></div>
  </div>

</div><!-- /main -->

<div id="gen-modal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(12,13,15,.92);align-items:center;justify-content:center;"><div style="background:var(--surf2);border:.5px solid var(--bd2);border-radius:12px;padding:2rem;width:min(440px,90vw);display:flex;flex-direction:column;gap:1rem;"><div style="font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.08em">ANNOTATION GENERATOR</div><div id="modal-status" style="font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8;min-height:44px"></div><div style="background:var(--bd);border-radius:4px;overflow:hidden;height:4px"><div id="modal-prog" style="height:100%;background:var(--accent);width:0%;transition:width .4s"></div></div><div id="modal-para-list" style="font-family:var(--mono);font-size:10px;color:var(--muted);max-height:120px;overflow-y:auto;line-height:2"></div><button id="modal-cancel" onclick="cancelGeneration()" style="align-self:flex-start;font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:5px;border:.5px solid var(--bd2);background:transparent;color:var(--muted);cursor:pointer;">キャンセル</button></div></div>
<!-- 動画ライブラリ（バックエンドの projects/ または任意フォルダの一覧から一括読込） -->
<div id="lib-modal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(12,13,15,.92);align-items:center;justify-content:center;">
  <div style="background:var(--surf2);border:.5px solid var(--bd2);border-radius:12px;padding:1.5rem;width:min(520px,92vw);display:flex;flex-direction:column;gap:.75rem;max-height:82vh">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.08em">VIDEO LIBRARY</div>
      <button onclick="closeLibrary()" style="font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:5px;border:.5px solid var(--bd2);background:transparent;color:var(--muted);cursor:pointer">閉じる</button>
    </div>
    <div id="lib-desc" style="font-size:10px;color:var(--muted);font-family:var(--mono);line-height:1.7">バックエンドの projects/ 配下、または任意の親フォルダ内の各動画フォルダ（動画・data.json・data.md）を一覧から一括読込します。</div>
    <div id="lib-root-row" style="display:flex;gap:6px;align-items:center">
      <input class="gen-input" id="lib-root" placeholder="ルートフォルダ（空=既定 projects）" style="flex:1" onkeydown="if(event.key==='Enter')loadLibraryIndex()">
      <button class="md-btn" onclick="loadLibraryIndex()">↻ 再読込</button>
    </div>
    <div class="gen-status" id="lib-status" style="min-height:16px"></div>
    <div id="lib-list" style="overflow-y:auto;display:flex;flex-direction:column;gap:6px"></div>
  </div>
</div>
<div id="toast"></div>
<!-- シャドーイング: 学習者録音の再生用（非表示）＋録音前カウントイン表示 -->
<audio id="rec-audio" preload="auto" style="display:none"></audio>
<div id="sh-countin"></div>

<script src="js/01-data.js"></script>
<script src="js/02-state.js"></script>
<script src="js/03-render-sync.js"></script>
<script src="js/04-player.js"></script>
<script src="js/05-sidebar.js"></script>
<script src="js/06-generate-youtube.js"></script>
<script src="js/07-generate-run.js"></script>
<script src="js/08-annotate-tempo.js"></script>
<script src="js/09-io-save-load.js"></script>
<script src="js/10-shadowing.js"></script>
<script src="js/12-notes.js"></script>
<script src="js/13-local-player.js"></script>
<script src="js/11-init.js"></script>

</body>
</html>
